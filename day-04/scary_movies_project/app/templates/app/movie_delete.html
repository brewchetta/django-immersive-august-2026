{% extends 'app/base.html' %}

{% block content %}

<form method="post">
    <p>Are you sure you want to delete {{ movie.title }}?</p>

    {% csrf_token %}

    <input type="submit" value="Confirm">
</form>

<a href="{% url 'movie_detail' pk=movie.pk %}">
    <button>Cancel</button>
</a>

{% endblock %}
